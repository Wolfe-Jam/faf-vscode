# ARMED 2026-09-08 — VSCE_PAT + OVSX_PAT repo secrets are set.
#
# To ship a version: bump `package.json` `version`, update CHANGELOG.md,
# commit, then `git tag vX.Y.Z && git push origin vX.Y.Z`. The tag must
# match `package.json` — `vsce publish` publishes whatever `package.json`
# says, so a mismatched tag either double-publishes or errors.
#
# The publish steps still carry `if:` guards on the secrets — remove a
# secret to disarm without touching this file.

name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      VSCE_PAT: ${{ secrets.VSCE_PAT }}
      OVSX_PAT: ${{ secrets.OVSX_PAT }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: bun test test/unit

      - name: Build
        run: npm run build

      - name: Package
        run: npx @vscode/vsce package

      # Guard against a broken runtime dep tree in the .vsix (e.g. `open`'s
      # transitive deps missing → cli.js DOA). Extract and run the bundled CLI.
      - name: Verify the packaged CLI runs
        run: |
          mkdir _vsix && unzip -q faf-context-*.vsix -d _vsix
          expected=$(node -p "require('./node_modules/faf-cli/package.json').version")
          actual=$(ELECTRON_RUN_AS_NODE=1 node "_vsix/extension/node_modules/faf-cli/dist/cli.js" --version)
          echo "expected faf-cli $expected, packaged $actual"
          test "$actual" = "$expected"

      - name: Upload the .vsix artifact
        uses: actions/upload-artifact@v4
        with:
          name: vsix
          path: faf-context-*.vsix

      # --- Publish the exact .vsix that passed the guard above. ---
      # (Armed 2026-09-08: VSCE_PAT + OVSX_PAT repo secrets set.)

      - name: Resolve the packaged .vsix path
        id: vsix
        run: echo "path=$(ls faf-context-*.vsix)" >> "$GITHUB_OUTPUT"

      - name: Publish to the VS Code Marketplace
        if: ${{ env.VSCE_PAT != '' }}
        run: npx @vscode/vsce publish --packagePath "${{ steps.vsix.outputs.path }}" -p "$VSCE_PAT"

      - name: Publish to Open VSX
        if: ${{ env.OVSX_PAT != '' }}
        run: npx ovsx publish "${{ steps.vsix.outputs.path }}" -p "$OVSX_PAT"

      - name: GitHub Release
        if: ${{ env.VSCE_PAT != '' }}
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.vsix.outputs.path }}
          generate_release_notes: true
