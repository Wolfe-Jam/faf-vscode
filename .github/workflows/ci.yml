name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install
        run: npm ci

      - name: Typecheck (tsc strict)
        run: npm run typecheck

      - name: Unit tests (bun)
        run: bun test test/unit

      - name: Build (esbuild)
        run: npm run build

      - name: Package check (vsce)
        run: npx @vscode/vsce ls

      # Tier 2 — a real VS Code extension host. Linux only, under a virtual
      # display; macOS/Windows runners can't run it headless.
      - name: Integration tests (VS Code host)
        if: matrix.os == 'ubuntu-latest'
        run: xvfb-run -a npm run test:integration
